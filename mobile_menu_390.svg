<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="drawerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- PHONE FRAME -->
  <rect width="390" height="844" rx="44" fill="#F8FAFC"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- DYNAMIC ISLAND -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#0F172A"/>

  <!-- STATUS BAR -->
  <text x="36" y="32" font-size="14" fill="#0F172A" font-weight="700">9:42</text>
  <g transform="translate(325, 22)">
    <path d="M0 10 L3 10 M5 8 L8 8 M10 5 L13 5 M15 2 L18 2" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#0F172A"/>
  </g>

  <!-- TOP BAR -->
  <g transform="translate(20, 56)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M22 12 L14 18 L22 24" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="24" font-size="17" font-weight="800" fill="#0F172A">Siam Corner Menu</text>
  </g>

  <!-- BACKGROUND RESTAURANT INFO (SEMI-DIMMED) -->
  <g transform="translate(20, 108)" opacity="0.4">
    <rect width="350" height="100" rx="16" fill="#FDE68A"/>
    <text x="175" y="65" font-size="44" text-anchor="middle">🍜</text>
    <rect y="112" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- DIMMED BACKDROP FOR BOTTOM SHEET -->
  <rect x="0" y="0" width="390" height="844" fill="#0F172A" opacity="0.45"/>

  <!-- ==================== PULL-UP CUSTOMIZATION BOTTOM SHEET ==================== -->
  <g transform="translate(0, 160)">
    <rect width="390" height="684" rx="28" fill="#FFFFFF" filter="url(#drawerShadow)"/>

    <!-- Drag Handle -->
    <rect x="175" y="12" width="40" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Close 'x' icon -->
    <g transform="translate(340, 18)">
      <circle cx="12" cy="12" r="12" fill="#F1F5F9"/>
      <path d="M8 8 L16 16 M16 8 L8 16" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Dish Header -->
    <g transform="translate(24, 32)">
      <text x="0" y="20" font-size="20" font-weight="800" fill="#0F172A">Pad Thai Boran Tamarind</text>
      <text x="0" y="42" font-size="13" fill="#64748B" width="340">
        <tspan x="0" dy="0">Traditional Bangkok rice noodles wok-charred with tamarind</tspan>
        <tspan x="0" dy="18">sauce, bean sprouts, crushed peanuts, and scallions.</tspan>
      </text>
      <text x="0" y="94" font-size="20" font-weight="800" fill="#FF5B26">$14.50</text>
    </g>

    <line x1="24" y1="140" x2="366" y2="140" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- OPTION 1: SPICE LEVEL (REQUIRED) -->
    <g transform="translate(24, 156)">
      <text x="0" y="16" font-size="14.5" font-weight="800" fill="#0F172A">Spice Level</text>
      <rect x="90" y="2" width="94" height="20" rx="10" fill="#FEF3C7"/>
      <text x="137" y="15.5" font-size="10" font-weight="800" fill="#D97706" text-anchor="middle">1 REQUIRED</text>

      <!-- Radio 1: Mild -->
      <g transform="translate(0, 32)">
        <circle cx="10" cy="10" r="9" stroke="#E2E8F0" stroke-width="2" fill="#FFFFFF"/>
        <text x="32" y="14" font-size="13.5" font-weight="500" fill="#334155">Mild (Comfort food warmth)</text>
      </g>

      <!-- Radio 2: Medium (Selected) -->
      <g transform="translate(0, 68)">
        <circle cx="10" cy="10" r="9" stroke="#FF5B26" stroke-width="2" fill="#FFFFFF"/>
        <circle cx="10" cy="10" r="5" fill="#FF5B26"/>
        <text x="32" y="14" font-size="13.5" font-weight="700" fill="#0F172A">Medium (Traditional Thai kick) 🌶️</text>
      </g>

      <!-- Radio 3: Thai Spicy -->
      <g transform="translate(0, 104)">
        <circle cx="10" cy="10" r="9" stroke="#E2E8F0" stroke-width="2" fill="#FFFFFF"/>
        <text x="32" y="14" font-size="13.5" font-weight="500" fill="#334155">Extra Hot &amp; Spicy 🌶️🌶️</text>
      </g>
    </g>

    <line x1="24" y1="296" x2="366" y2="296" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- OPTION 2: PROTEIN CHOICE (REQUIRED) -->
    <g transform="translate(24, 312)">
      <text x="0" y="16" font-size="14.5" font-weight="800" fill="#0F172A">Choice of Protein</text>
      <rect x="135" y="2" width="94" height="20" rx="10" fill="#FEF3C7"/>
      <text x="182" y="15.5" font-size="10" font-weight="800" fill="#D97706" text-anchor="middle">1 REQUIRED</text>

      <!-- Radio 1: Tofu (Selected) -->
      <g transform="translate(0, 32)">
        <circle cx="10" cy="10" r="9" stroke="#FF5B26" stroke-width="2" fill="#FFFFFF"/>
        <circle cx="10" cy="10" r="5" fill="#FF5B26"/>
        <text x="32" y="14" font-size="13.5" font-weight="700" fill="#0F172A">Crispy Organic Tofu</text>
        <text x="342" y="14" font-size="13" font-weight="600" fill="#0D9488" text-anchor="end">+$0.00</text>
      </g>

      <!-- Radio 2: Chicken -->
      <g transform="translate(0, 68)">
        <circle cx="10" cy="10" r="9" stroke="#E2E8F0" stroke-width="2" fill="#FFFFFF"/>
        <text x="32" y="14" font-size="13.5" font-weight="500" fill="#334155">Free-Range Chicken Breast</text>
        <text x="342" y="14" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">+$2.00</text>
      </g>

      <!-- Radio 3: Tiger Shrimp -->
      <g transform="translate(0, 104)">
        <circle cx="10" cy="10" r="9" stroke="#E2E8F0" stroke-width="2" fill="#FFFFFF"/>
        <text x="32" y="14" font-size="13.5" font-weight="500" fill="#334155">Jumbo Wild Tiger Shrimp</text>
        <text x="342" y="14" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">+$4.00</text>
      </g>
    </g>

    <!-- FIXED BOTTOM ACTION BAR -->
    <g transform="translate(0, 485)">
      <rect width="390" height="110" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="390" y2="0" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Quantity Stepper -->
      <g transform="translate(24, 16)">
        <rect width="100" height="48" rx="14" fill="#F1F5F9"/>
        <text x="22" y="30" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">－</text>
        <text x="50" y="29.5" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">1</text>
        <text x="78" y="30" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">＋</text>
      </g>

      <!-- Add to Cart CTA Button -->
      <g transform="translate(136, 16)">
        <rect width="230" height="48" rx="14" fill="#FF5B26"/>
        <text x="115" y="29.5" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Cart · $14.50</text>
      </g>

      <!-- Home Indicator -->
      <rect x="130" y="82" width="130" height="5" rx="2.5" fill="#0F172A"/>
    </g>
  </g>
</svg>
