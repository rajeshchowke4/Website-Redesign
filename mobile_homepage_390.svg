<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="mShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="mHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B26"/>
      <stop offset="100%" stop-color="#FF7A3D"/>
    </linearGradient>
  </defs>

  <!-- PHONE FRAME & BACKGROUND -->
  <rect width="390" height="844" rx="44" fill="#F8FAFC"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- DYNAMIC ISLAND -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#0F172A"/>

  <!-- STATUS BAR -->
  <text x="36" y="32" font-size="14" fill="#0F172A" font-weight="700">9:41</text>
  <g transform="translate(325, 22)">
    <path d="M0 10 L3 10 M5 8 L8 8 M10 5 L13 5 M15 2 L18 2" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#0F172A"/>
  </g>

  <!-- TOP APP BAR -->
  <g transform="translate(20, 56)">
    <!-- Address Header -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">DELIVER TO</text>
      <text x="0" y="32" font-size="17" font-weight="800" fill="#0F172A">18 Mercer Street ▾</text>
    </g>

    <!-- User Profile & Notifications -->
    <g transform="translate(310, 2)">
      <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#mShadow)"/>
      <circle cx="20" cy="16" r="6" fill="#64748B"/>
      <path d="M12 30 C12 25 15 23 20 23 C25 23 28 25 28 30" fill="#64748B"/>
      <circle cx="32" cy="8" r="4" fill="#FF5B26"/>
    </g>
  </g>

  <!-- SEARCH INPUT -->
  <g transform="translate(20, 114)">
    <rect width="350" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#mShadow)"/>
    <circle cx="20" cy="23" r="6" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
    <line x1="25" y1="28" x2="30" y2="33" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="44" y="28" font-size="14" fill="#94A3B8">Search dishes, ramen, pizza...</text>
    <rect x="306" y="10" width="32" height="26" rx="8" fill="#F1F5F9"/>
    <text x="322" y="27" font-size="12" text-anchor="middle">⚡</text>
  </g>

  <!-- PROMO HERO CARD -->
  <g transform="translate(20, 172)">
    <rect width="350" height="110" rx="18" fill="url(#mHeroGrad)" filter="url(#mShadow)"/>
    <g transform="translate(20, 24)">
      <rect width="130" height="20" rx="10" fill="#FFFFFF" opacity="0.2"/>
      <text x="65" y="14" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">⚡ UNDER 25 MIN</text>
      <text x="0" y="46" font-size="18" font-weight="800" fill="#FFFFFF">Dinner without guesswork</text>
      <text x="0" y="66" font-size="12" fill="#FFFFFF" opacity="0.9">Transparent pricing · 0 surprise fees</text>
    </g>
    <text x="295" y="75" font-size="44" text-anchor="middle">🍜</text>
  </g>

  <!-- CATEGORY PILLS (HORIZONTAL SCROLL) -->
  <g transform="translate(20, 296)">
    <!-- Pill 1: All -->
    <rect x="0" y="0" width="60" height="34" rx="17" fill="#0F172A"/>
    <text x="30" y="21" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">All</text>

    <!-- Pill 2: Thai -->
    <rect x="68" y="0" width="85" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="110" y="21" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🍜 Thai</text>

    <!-- Pill 3: Italian -->
    <rect x="160" y="0" width="90" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="205" y="21" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🍕 Pizza</text>

    <!-- Pill 4: Bowls -->
    <rect x="258" y="0" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="304" y="21" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🥗 Bowls</text>
  </g>

  <!-- RESTAURANT FEED HEADER -->
  <g transform="translate(20, 348)">
    <text x="0" y="16" font-size="17" font-weight="800" fill="#0F172A">Popular Near You</text>
    <text x="350" y="15" font-size="12" font-weight="700" fill="#FF5B26" text-anchor="end">See all (38)</text>
  </g>

  <!-- RESTAURANT CARDS -->
  <g transform="translate(20, 376)">
    <!-- Card 1: Siam Corner -->
    <g transform="translate(0, 0)">
      <rect width="350" height="170" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#mShadow)"/>
      <rect width="350" height="90" rx="18" fill="#FDE68A"/>
      <text x="175" y="58" font-size="38" text-anchor="middle">🍜</text>

      <!-- Badge Tags -->
      <rect x="12" y="12" width="76" height="22" rx="11" fill="#0F172A" opacity="0.9"/>
      <text x="50" y="26.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">TOP PICK</text>

      <rect x="274" y="12" width="64" height="22" rx="11" fill="#FFFFFF"/>
      <text x="306" y="26.5" font-size="10.5" font-weight="800" fill="#0F172A" text-anchor="middle">★ 4.9</text>

      <g transform="translate(14, 106)">
        <text x="0" y="16" font-size="15" font-weight="800" fill="#0F172A">Siam Corner · Authentic Thai</text>
        <text x="0" y="34" font-size="12" fill="#64748B">Crispy Pad Thai, Tom Kha, Green Curry</text>
        <text x="0" y="52" font-size="12" font-weight="700" fill="#0F766E">⏱ 15–20 min  •  Free Delivery</text>
        <text x="322" y="52" font-size="12" font-weight="600" fill="#64748B" text-anchor="end">0.8 mi</text>
      </g>
    </g>

    <!-- Card 2: Pasta Poet -->
    <g transform="translate(0, 185)">
      <rect width="350" height="170" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#mShadow)"/>
      <rect width="350" height="90" rx="18" fill="#FECDD3"/>
      <text x="175" y="58" font-size="38" text-anchor="middle">🍝</text>

      <rect x="12" y="12" width="80" height="22" rx="11" fill="#0D9488"/>
      <text x="52" y="26.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARTISAN</text>

      <rect x="274" y="12" width="64" height="22" rx="11" fill="#FFFFFF"/>
      <text x="306" y="26.5" font-size="10.5" font-weight="800" fill="#0F172A" text-anchor="middle">★ 4.8</text>

      <g transform="translate(14, 106)">
        <text x="0" y="16" font-size="15" font-weight="800" fill="#0F172A">Pasta Poet · Handmade Bowls</text>
        <text x="0" y="34" font-size="12" fill="#64748B">Truffle Tagliatelle, Rigatoni Bolognese</text>
        <text x="0" y="52" font-size="12" font-weight="700" fill="#0F766E">⏱ 20–25 min  •  $0.99 delivery</text>
      </g>
    </g>
  </g>

  <!-- FLOATING BOTTOM NAVIGATION BAR -->
  <g transform="translate(0, 756)">
    <rect width="390" height="88" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Home (Active) -->
    <g transform="translate(50, 14)">
      <circle cx="16" cy="12" r="14" fill="#FF5B26" opacity="0.12"/>
      <circle cx="16" cy="12" r="6" fill="#FF5B26"/>
      <text x="16" y="32" font-size="10" font-weight="700" fill="#FF5B26" text-anchor="middle">Explore</text>
    </g>

    <!-- Orders -->
    <g transform="translate(150, 14)">
      <rect x="8" y="4" width="16" height="16" rx="4" fill="none" stroke="#64748B" stroke-width="1.8"/>
      <text x="16" y="32" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Orders</text>
    </g>

    <!-- Cart with Badge -->
    <g transform="translate(245, 14)">
      <path d="M6 6 L10 6 L14 18 L24 18 L26 10 L12 10" stroke="#0F172A" stroke-width="1.8" fill="none"/>
      <circle cx="15" cy="21" r="1.5" fill="#0F172A"/>
      <circle cx="22" cy="21" r="1.5" fill="#0F172A"/>
      <circle cx="26" cy="6" r="6" fill="#FF5B26"/>
      <text x="26" y="9" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="16" y="32" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Cart</text>
    </g>

    <!-- Profile -->
    <g transform="translate(325, 14)">
      <circle cx="16" cy="8" r="5" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <path d="M9 19 C9 15 12 14 16 14 C20 14 23 15 23 19" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <text x="16" y="32" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Account</text>
    </g>

    <!-- Home Indicator Bar -->
    <rect x="130" y="72" width="130" height="5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>
