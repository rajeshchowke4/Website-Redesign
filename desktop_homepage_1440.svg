          <text x="96" y="14" font-size="13" font-weight="600" fill="#334155">$0.99 delivery</text>
          <circle cx="185" cy="10" r="2.5" fill="#94A3B8"/>
          <text x="196" y="14" font-size="13" font-weight="500" fill="#64748B">$$$ · 1.2 mi</text>
