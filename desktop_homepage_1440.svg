      <text x="85" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">⚡ DINNER IN UNDER 25 MIN</text>
      
      <text x="0" y="60" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">Hungry? Order dinner without the guesswork.</text>
      <text x="0" y="86" font-size="14.5" fill="#FFFFFF" opacity="0.95">Upfront pricing, zero hidden service fees, and real-time culinary tracking from kitchen to table.</text>

      <g transform="translate(0, 104)">
