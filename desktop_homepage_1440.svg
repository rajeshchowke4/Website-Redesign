<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B26"/>
      <stop offset="50%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FF9356"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="floatShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <clipPath id="heroImgClip">
      <rect x="0" y="0" width="460" height="260" rx="20"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect width="370" height="180" rx="16"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- ==================== TOP NAVIGATION BAR ==================== -->
  <rect width="1440" height="80" fill="#FFFFFF"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#E2E8F0" stroke-width="1"/>

  <g transform="translate(60, 20)">
    <!-- Brand Logo -->
    <g transform="translate(0, 5)">
      <rect width="36" height="36" rx="10" fill="#FF5B26"/>
      <path d="M12 18 C12 12, 24 12, 24 18 C24 24, 18 26, 18 28 M18 20 C14 20, 14 24, 18 24" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <circle cx="18" cy="13" r="2.2" fill="#FFFFFF"/>
      <text x="46" y="26" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Savory<tspan fill="#FF5B26">.</tspan></text>
    </g>

    <!-- Address Selector Pill -->
    <g transform="translate(190, 4)">
      <rect width="230" height="38" rx="19" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#FF5B26" opacity="0.15"/>
      <circle cx="20" cy="19" r="3" fill="#FF5B26"/>
      <text x="36" y="24" font-size="13" font-weight="600" fill="#0F172A">18 Mercer Street, Soho</text>
      <path d="M208 17 L213 22 L218 17" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Global Search Bar -->
    <g transform="translate(440, 4)">
      <rect width="440" height="38" rx="19" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" stroke="#94A3B8" stroke-width="1.8" fill="none"/>
      <line x1="25" y1="24" x2="30" y2="29" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="40" y="24" font-size="13.5" fill="#94A3B8">Search dishes, cuisines, or restaurants...</text>
      <rect x="390" y="10" width="34" height="20" rx="5" fill="#E2E8F0"/>
      <text x="407" y="23.5" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">⌘ K</text>
    </g>

    <!-- Right Controls: Dietary, Orders, Profile & Sticky Cart -->
    <g transform="translate(1040, 2)">
      <!-- Dietary Quick Filter -->
      <g transform="translate(0, 6)">
        <text x="0" y="22" font-size="13" font-weight="600" fill="#64748B">Dietary: <tspan fill="#0F766E">All Dietary</tspan></text>
      </g>

      <!-- Cart Button with Live Badge -->
      <g transform="translate(140, 2)">
        <rect width="130" height="42" rx="21" fill="#FF5B26" filter="url(#cardShadow)"/>
        <!-- Cart Icon -->
        <path d="M22 14 L26 14 L30 26 L39 26 L42 18 L27 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="31" cy="29" r="1.5" fill="#FFFFFF"/>
        <circle cx="38" cy="29" r="1.5" fill="#FFFFFF"/>
        <text x="52" y="26" font-size="13.5" font-weight="700" fill="#FFFFFF">Cart</text>
        <circle cx="95" cy="21" r="10" fill="#FFFFFF"/>
        <text x="95" y="25" font-size="11" font-weight="800" fill="#FF5B26" text-anchor="middle">3</text>
      </g>

      <!-- User Profile Avatar -->
      <g transform="translate(285, 4)">
        <circle cx="18" cy="18" r="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
        <circle cx="18" cy="14" r="6" fill="#64748B"/>
        <path d="M9 30 C9 24 13 22 18 22 C23 22 27 24 27 30" fill="#64748B"/>
      </g>
    </g>
