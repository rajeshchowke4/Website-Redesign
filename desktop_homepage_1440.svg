      <rect x="16" y="16" width="60" height="60" rx="12" fill="#FEF3C7"/>
      <text x="46" y="52" font-size="30" text-anchor="middle">🍜</text>
      <text x="88" y="34" font-size="15" font-weight="700" fill="#0F172A">Siam Noodle Bar</text>
      <text x="88" y="52" font-size="12" font-weight="600" fill="#0D9488">★ 4.9 (1.4k) · Thai Street Food</text>
