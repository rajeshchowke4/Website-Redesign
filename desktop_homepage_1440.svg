          <circle cx="85" cy="10" r="2.5" fill="#94A3B8"/>
          <text x="96" y="14" font-size="13" font-weight="600" fill="#334155">Free Delivery</text>
          <circle cx="185" cy="10" r="2.5" fill="#94A3B8"/>
          <text x="196" y="14" font-size="13" font-weight="500" fill="#64748B">$$ · 0.6 mi</text>
        </g>
