  <!-- ==================== HERO VALUE BANNER ==================== -->
  <g transform="translate(60, 105)">
    <rect width="1320" height="190" rx="24" fill="url(#heroGrad)" filter="url(#cardShadow)"/>
    
    <!-- Decorative Ambient Circles -->
    <circle cx="1180" cy="95" r="140" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="1260" cy="130" r="90" fill="#FFFFFF" opacity="0.08"/>

    <!-- Left Content -->
    <g transform="translate(48, 36)">
