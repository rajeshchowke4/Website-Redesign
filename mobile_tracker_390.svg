<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="mTrackShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-6" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- PHONE FRAME -->
  <rect width="390" height="844" rx="44" fill="#E2E8F0"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <!-- ==================== TOP MAP VIEW ==================== -->
  <g id="MapView">
    <!-- Map Background -->
    <rect width="390" height="460" rx="44" fill="#E2E8F0"/>

    <!-- Map Streets -->
    <path d="M0 120 L390 120 M0 240 L390 240 M0 360 L390 360" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M110 0 L110 460 M260 0 L260 460" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M30 460 L360 80" stroke="#FFFBEB" stroke-width="16"/>

    <!-- Street Labels -->
    <text x="120" y="112" font-size="10" font-weight="700" fill="#94A3B8">HOUSTON ST</text>
    <text x="120" y="232" font-size="10" font-weight="700" fill="#94A3B8">PRINCE ST</text>

    <!-- ROUTE LINE -->
    <path d="M280 100 L210 180 L180 260 L110 320" fill="none" stroke="#FF5B26" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/>

    <!-- Restaurant Pin -->
    <g transform="translate(280, 100)">
      <circle cx="0" cy="0" r="14" fill="#0D9488" filter="url(#pinShadow)"/>
      <text x="0" y="4" font-size="10" text-anchor="middle" fill="#FFFFFF">🍜</text>
    </g>

    <!-- Destination Pin -->
    <g transform="translate(110, 320)">
      <circle cx="0" cy="0" r="14" fill="#10B981" filter="url(#pinShadow)"/>
      <text x="0" y="4" font-size="10" text-anchor="middle" fill="#FFFFFF">🏠</text>
    </g>

    <!-- LIVE COURIER VEHICLE MARKER -->
    <g transform="translate(195, 220)">
      <circle cx="0" cy="0" r="24" fill="#FF5B26" opacity="0.25"/>
      <circle cx="0" cy="0" r="16" fill="#FF5B26" filter="url(#pinShadow)"/>
      <text x="0" y="5" font-size="13" text-anchor="middle" fill="#FFFFFF">🛵</text>
      
      <!-- Small Tooltip -->
      <rect x="-42" y="-36" width="84" height="22" rx="6" fill="#0F172A"/>
      <text x="0" y="-22" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3 mins away</text>
    </g>
  </g>

  <!-- DYNAMIC ISLAND & STATUS OVERLAY -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#0F172A"/>
  <text x="36" y="32" font-size="14" fill="#0F172A" font-weight="700">9:45</text>

  <!-- FLOATING APP CONTROLS -->
  <g transform="translate(20, 56)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" filter="url(#pinShadow)"/>
    <path d="M22 12 L14 18 L22 24" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <g transform="translate(290, 0)">
      <rect width="60" height="36" rx="18" fill="#FFFFFF" filter="url(#pinShadow)"/>
      <text x="30" y="23" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Help 🎧</text>
    </g>
  </g>

  <!-- ==================== PULL-UP MILESTONE STATUS SHEET ==================== -->
  <g transform="translate(0, 390)">
    <rect width="390" height="454" rx="28" fill="#FFFFFF" filter="url(#mTrackShadow)"/>
    <rect x="175" y="12" width="40" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Status Header -->
    <g transform="translate(24, 28)">
      <rect width="115" height="22" rx="11" fill="#FF5B26" opacity="0.12"/>
      <text x="57" y="15.5" font-size="10.5" font-weight="800" fill="#FF5B26" text-anchor="middle">ON THE WAY</text>

      <text x="0" y="48" font-size="22" font-weight="800" fill="#0F172A">Arriving in 14 min</text>
      <text x="0" y="68" font-size="13" fill="#64748B">Estimated arrival at <tspan font-weight="700" fill="#0F172A">7:24 PM</tspan></text>

      <!-- Progress Line -->
      <g transform="translate(0, 84)">
        <rect width="342" height="6" rx="3" fill="#F1F5F9"/>
        <rect width="250" height="6" rx="3" fill="#FF5B26"/>
      </g>
    </g>

    <!-- COURIER CARD -->
    <g transform="translate(24, 134)">
      <rect width="342" height="84" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="34" cy="42" r="22" fill="#CBD5E1"/>
      <text x="34" y="49" font-size="20" text-anchor="middle">🧔🏽</text>

      <g transform="translate(68, 22)">
        <text x="0" y="14" font-size="14" font-weight="800" fill="#0F172A">Marcus Vance</text>
        <text x="0" y="30" font-size="12" font-weight="600" fill="#0F766E">★ 4.98 · Silver E-Bike</text>
        <text x="0" y="46" font-size="11" fill="#64748B">Plate: NY-71</text>
      </g>

      <!-- Contact Buttons -->
      <g transform="translate(245, 24)">
        <circle cx="18" cy="18" r="18" fill="#FF5B26"/>
        <text x="18" y="23" font-size="14" text-anchor="middle" fill="#FFFFFF">📞</text>
        <circle cx="60" cy="18" r="18" fill="#0F172A"/>
        <text x="60" y="23" font-size="13" text-anchor="middle" fill="#FFFFFF">💬</text>
      </g>
    </g>

    <!-- MILESTONES MINI LIST -->
    <g transform="translate(24, 234)">
      <!-- Step 1 -->
      <circle cx="10" cy="10" r="10" fill="#10B981"/>
      <text x="10" y="14" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="30" y="14" font-size="13" font-weight="700" fill="#0F172A">Order Confirmed</text>
      <text x="342" y="14" font-size="12" fill="#64748B" text-anchor="end">7:02 PM</text>
      <line x1="10" y1="22" x2="10" y2="40" stroke="#10B981" stroke-width="2"/>

      <!-- Step 2 -->
      <g transform="translate(0, 42)">
        <circle cx="10" cy="10" r="10" fill="#10B981"/>
        <text x="10" y="14" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="30" y="14" font-size="13" font-weight="700" fill="#0F172A">Prepared by Siam Corner</text>
        <text x="342" y="14" font-size="12" fill="#64748B" text-anchor="end">7:14 PM</text>
        <line x1="10" y1="22" x2="10" y2="40" stroke="#FF5B26" stroke-width="2"/>
      </g>

      <!-- Step 3 (Active) -->
      <g transform="translate(0, 84)">
        <circle cx="10" cy="10" r="12" fill="#FF5B26"/>
        <text x="10" y="14" font-size="10" text-anchor="middle" fill="#FFFFFF">🛵</text>
        <text x="30" y="14" font-size="13" font-weight="800" fill="#FF5B26">On the Way to 18 Mercer St</text>
        <text x="342" y="14" font-size="12" font-weight="600" fill="#FF5B26" text-anchor="end">7:24 PM</text>
      </g>
    </g>

    <!-- Bottom Indicator -->
    <rect x="130" y="434" width="130" height="5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>
