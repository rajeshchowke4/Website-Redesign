<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- PHONE FRAME -->
  <rect width="390" height="844" rx="44" fill="#F8FAFC"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- DYNAMIC ISLAND -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#0F172A"/>

  <!-- STATUS BAR -->
  <text x="36" y="32" font-size="14" fill="#0F172A" font-weight="700">9:43</text>
  <g transform="translate(325, 22)">
    <path d="M0 10 L3 10 M5 8 L8 8 M10 5 L13 5 M15 2 L18 2" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="26" y="4" width="14" height="6" rx="1.5" fill="#0F172A"/>
  </g>

  <!-- TOP APP BAR -->
  <g transform="translate(20, 56)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M22 12 L14 18 L22 24" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="24" font-size="18" font-weight="800" fill="#0F172A">Review &amp; Checkout</text>
    <rect x="280" y="6" width="70" height="24" rx="12" fill="#E6FFFA"/>
    <text x="315" y="22" font-size="11" font-weight="700" fill="#0D9488" text-anchor="middle">SECURE 🔒</text>
  </g>

  <!-- CONTENT CONTAINER -->
  <g transform="translate(20, 108)">
    
    <!-- ADDRESS & INSTRUCTIONS CARD -->
    <g transform="translate(0, 0)">
      <rect width="350" height="84" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cShadow)"/>
      <circle cx="28" cy="30" r="14" fill="#FF5B26" opacity="0.12"/>
      <circle cx="28" cy="30" r="5" fill="#FF5B26"/>
      <g transform="translate(54, 20)">
        <text x="0" y="14" font-size="14.5" font-weight="800" fill="#0F172A">Deliver to Home (18 Mercer St)</text>
        <text x="0" y="32" font-size="12" fill="#64748B">Apt 4B · Leave at door · Buzzer #4B</text>
      </g>
      <text x="330" y="46" font-size="12" font-weight="700" fill="#FF5B26" text-anchor="end">Edit</text>
    </g>

    <!-- ESTIMATED ETA CARD -->
    <g transform="translate(0, 96)">
      <rect width="350" height="54" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <circle cx="26" cy="27" r="12" fill="#DCFCE7"/>
      <text x="26" y="32" font-size="13" text-anchor="middle">⚡</text>
      <text x="50" y="26" font-size="13.5" font-weight="800" fill="#15803D">Fast Priority Delivery: 15–20 mins</text>
      <text x="50" y="42" font-size="11.5" fill="#166534">Estimated arrival around 7:05 PM</text>
    </g>

    <!-- TIP SELECTION SECTION -->
    <g transform="translate(0, 162)">
      <rect width="350" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cShadow)"/>
      <g transform="translate(18, 16)">
        <text x="0" y="14" font-size="13.5" font-weight="800" fill="#0F172A">Courier Tip (100% goes to driver)</text>
        
        <!-- Tip Pills -->
        <g transform="translate(0, 26)">
          <rect width="66" height="34" rx="10" fill="#F1F5F9"/>
          <text x="33" y="21.5" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">$2.00</text>

          <rect x="74" width="82" height="34" rx="10" fill="#FF5B26"/>
          <text x="115" y="21.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">$3.00 ★</text>

          <rect x="164" width="66" height="34" rx="10" fill="#F1F5F9"/>
          <text x="197" y="21.5" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">$4.00</text>

          <rect x="238" width="76" height="34" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <text x="276" y="21.5" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Custom</text>
        </g>
      </g>
    </g>

    <!-- TRANSPARENT PRICE SUMMARY -->
    <g transform="translate(0, 270)">
      <rect width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cShadow)"/>
      <g transform="translate(18, 20)">
        <text x="0" y="14" font-size="14.5" font-weight="800" fill="#0F172A">Order Breakdown (3 items)</text>
        
        <g transform="translate(0, 32)">
          <text x="0" y="12" font-size="13" fill="#64748B">Items Subtotal</text>
          <text x="314" y="12" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">$27.90</text>

          <text x="0" y="34" font-size="13" fill="#64748B">Delivery Fee</text>
          <text x="314" y="34" font-size="13" font-weight="700" fill="#0D9488" text-anchor="end">FREE</text>

          <text x="0" y="56" font-size="13" fill="#64748B">Service Fee (5%)</text>
          <text x="314" y="56" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">$1.40</text>

          <text x="0" y="78" font-size="13" fill="#64748B">Estimated Tax</text>
          <text x="314" y="78" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">$2.48</text>

          <text x="0" y="100" font-size="13" fill="#64748B">Courier Tip</text>
          <text x="314" y="100" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">$3.00</text>
        </g>

        <line x1="0" y1="148" x2="314" y2="148" stroke="#E2E8F0" stroke-width="1"/>

        <!-- Final Total -->
        <g transform="translate(0, 166)">
          <text x="0" y="16" font-size="16" font-weight="800" fill="#0F172A">Total to Pay</text>
          <text x="314" y="16" font-size="18" font-weight="800" fill="#0F172A" text-anchor="end">$34.78</text>
        </g>
      </g>
    </g>

    <!-- PAYMENT SELECTOR -->
    <g transform="translate(0, 492)">
      <rect width="350" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cShadow)"/>
      <g transform="translate(18, 16)">
        <text x="0" y="15" font-size="14" font-weight="700" fill="#0F172A"> Pay</text>
        <text x="56" y="15" font-size="13" fill="#64748B">Apple Pay Cash (•••• 9012)</text>
        <text x="314" y="15" font-size="12" font-weight="700" fill="#FF5B26" text-anchor="end">Change</text>
      </g>
    </g>
  </g>

  <!-- FIXED BOTTOM CHECKOUT CTA -->
  <g transform="translate(0, 746)">
    <rect width="390" height="98" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#E2E8F0" stroke-width="1"/>
    
    <g transform="translate(20, 14)">
      <rect width="350" height="52" rx="16" fill="#FF5B26"/>
      <text x="175" y="32" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Place Order · $34.78 →</text>
    </g>

    <rect x="130" y="78" width="130" height="5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>
